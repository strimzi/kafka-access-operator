image:
  registry: quay.io
  repository: strimzi
  name: access-operator
  tag: latest
  imagePullSecrets: []

podSecurityContext: {}
securityContext:
  # Specifies container security context. Defaults to a security context that matches the Restricted Kubernetes
  # Pod Security Standard (https://kubernetes.io/docs/concepts/security/pod-security-standards/).
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

resources:
  limits:
    memory: 256Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 100m
livenessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  initialDelaySeconds: 10
  periodSeconds: 30
annotations: {}
labels: {}

# Node selector for the Access Operator Pod
nodeSelector: {}

# Affinity rules for the Access Operator Pod
affinity: {}

# Tolerations for the Access Operator Pod
tolerations: []